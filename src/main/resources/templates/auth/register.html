<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h2 class="auth-title">Register</h2>
        <p class="auth-subtitle">Create your account</p>

        <div th:if="${error}" class="auth-error" th:text="${error}"></div>
        <div th:if="${success}" class="auth-success" th:text="${success}"></div>

        <form method="post" th:action="@{/register}" class="auth-form">

            <input type="text"
                   name="username"
                   th:value="${registerRequest != null ? registerRequest.username : ''}"
                   placeholder="Username"
                   required>

            <input type="email"
                   name="email"
                   th:value="${registerRequest != null ? registerRequest.email : ''}"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit" class="primary-btn full">
                Create account
            </button>

        </form>

        <a href="/login" class="auth-link">
            Back to login
        </a>

    </div>

</div>

</body>
</html>
