<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
</head>
<body>

<h2>Register</h2>

<!-- Ошибка -->
<div th:if="${error}" th:text="${error}" style="color:red"></div>

<!-- Успех -->
<div th:if="${success}" th:text="${success}" style="color:green"></div>

<form method="post" th:action="@{/register}">

    <!-- соответствует RegisterRequest.username -->
    <input type="text"
           name="username"
           th:value="${registerRequest != null ? registerRequest.username : ''}"
           placeholder="Username"
           required/>
    <br/>

    <!-- соответствует RegisterRequest.email -->
    <input type="email"
           name="email"
           th:value="${registerRequest != null ? registerRequest.email : ''}"
           placeholder="Email"
           required/>
    <br/>

    <!-- соответствует RegisterRequest.password -->
    <input type="password"
           name="password"
           placeholder="Password"
           required/>
    <br/>

<!--    &lt;!&ndash; CSRF &ndash;&gt;-->
<!--    <input type="hidden"-->
<!--           th:if="${_csrf != null}"-->
<!--           th:name="${_csrf.parameterName}"-->
<!--           th:value="${_csrf.token}" />-->

    <button type="submit">Register</button>
</form>

<a href="/login">Back to Login</a>

</body>
</html>
