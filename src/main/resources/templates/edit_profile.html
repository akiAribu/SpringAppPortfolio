<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link rel="stylesheet" href="/css/edit_profile.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<header class="topbar">
    <div class="topbar-left">
        <a href="/profile" class="back-button">← Back to Profile</a>
    </div>
</header>

<main class="layout">

    <aside class="sidebar">

        <div class="profile-preview-card">

            <div class="avatar-wrapper">
                <img src="/api/v1/users/me/avatar" alt="Avatar">
            </div>

            <div class="profile-preview-info">

                <h2 th:text="${user.username}">Username</h2>

                <p th:text="${portfolio.specialization != null ? portfolio.specialization.displayName : 'No specialization'}"></p>

            </div>
        </div>

    </aside>

    <section class="content-area">

        <div class="settings-card">

            <div class="card-header">
                <h2>Basic Info</h2>
                <p>Update your account information</p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" th:value="${user.username}">
                    <div id="usernameError" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" th:value="${user.email}">
                    <div id="emailError" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" th:value="${user.firstName != null ? user.firstName : ''}">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" th:value="${user.lastName != null ? user.lastName : ''}">
                </div>

            </div>

            <button class="primary-btn" onclick="updateProfile()">Save Profile</button>

            <p id="profileResult" class="result-message"></p>
        </div>

        <div class="settings-card">

            <div class="card-header">
                <h2>Portfolio Info</h2>
                <p>Manage your public portfolio</p>
            </div>

            <div class="form-group">

                <label>Specialization</label>

                <input type="text"
                       id="specialization"
                       list="specializationList"
                       placeholder="Select specialization"
                       autocomplete="off">

                <datalist id="specializationList"></datalist>

                <div id="specializationError" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>Experience</label>

                <input type="number"
                       id="experienceYears"
                       min="0"
                       placeholder="Experience years"
                       th:value="${portfolio.experienceYears != null ? portfolio.experienceYears : ''}">
            </div>

            <div class="form-group">
                <label>Bio</label>

                <textarea id="bio" rows="6" placeholder="Tell about yourself"
                          th:text="${portfolio.bio != null ? portfolio.bio : ''}">
                </textarea>
            </div>

            <button class="primary-btn" onclick="updatePortfolio()">Save Portfolio</button>

            <p id="portfolioResult" class="result-message"></p>
        </div>

        <div class="settings-card">
            <div class="card-header">
                <h2>Contacts</h2>
                <p>Manage your public contacts</p>
            </div>

            <div id="contactsContainer" class="contacts-list"></div>

            <p id="contactsEmpty" class="empty-text" style="display:none;">No contacts</p>

            <div class="contact-form">

                <div class="form-group">
                    <label>Contact Type</label>
                    <input type="text" id="contactType" placeholder="Telegram, Email, GitHub">
                    <div id="contactTypeError" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label>Contact Value</label>
                    <input type="text" id="contactValue" placeholder="@username or link">
                    <div id="contactValueError" class="field-error"></div>
                </div>

                <button class="primary-btn" onclick="createContact()">Add Contact</button>

                <p id="contactResult" class="result-message"></p>

            </div>
        </div>

        <div class="settings-card">

            <div class="card-header">
                <h2>Change Password</h2>
                <p>Update your account password</p>
            </div>

            <div class="form-group">
                <label>Old Password</label>
                <input type="password" id="oldPassword">
                <div id="oldPasswordError" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword">
                <div id="newPasswordError" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword">
                <div id="confirmPasswordError" class="field-error"></div>
            </div>

            <button class="primary-btn" onclick="changePassword()">Change Password</button>

            <p id="passwordResult" class="result-message"></p>

        </div>

    </section>
</main>

<script th:inline="javascript">
    const currentSpec = [[${portfolio.specialization != null ? portfolio.specialization.displayName : "''"}]];
</script>

<script src="/js/edit_profile.js"></script>

</body>
</html>
