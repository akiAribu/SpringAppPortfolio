<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Gallery</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:src="@{/js/home.js}" defer></script>
</head>
<body>

<div class="header">
    <h1>Portfolio Gallery</h1>
    <div class="header-right">
        <a th:href="@{/profile}">My Profile</a>
        <a th:href="@{/login}">Login</a>
    </div>
</div>

<div class="main-content">
    <div class="toolbar">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name..." autocomplete="off">
        </div>
        <div class="toolbar-row">
            <div class="filter-dropdown">
                <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">
                    <span>Filter by Specialization</span>
                    <span id="filterIcon">▼</span>
                </button>
                <div class="filter-content" id="filterContent">
                    <div class="filter-header">
                        <h3>Filters</h3>
                        <div class="filter-actions">
                            <button class="btn-apply" onclick="applyFilters()">Apply</button>
                            <button class="btn-clear" onclick="clearFilters()">Clear</button>
                        </div>
                    </div>
                    <div class="filter-section">
                        <h4>Specializations</h4>
                        <div class="checkbox-group" id="specializationsList"></div>
                    </div>
                    <div class="filter-section">
                        <h4>Experience</h4>
                        <div class="checkbox-group" id="experienceList">
                            <div class="checkbox-item">
                                <input type="checkbox" id="exp-0" value="0" onchange="updateFilterButton()">
                                <label for="exp-0">No experience</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="exp-1-3" value="1-3" onchange="updateFilterButton()">
                                <label for="exp-1-3">1-3 years</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="exp-3-5" value="3-5" onchange="updateFilterButton()">
                                <label for="exp-3-5">3-5 years</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="exp-5+" value="5+" onchange="updateFilterButton()">
                                <label for="exp-5+">5+ years</label>
                            </div>
                        </div>
                    </div>
                    <div class="filter-section">
                        <h4>Tech Tags</h4>
                        <div class="checkbox-group" id="tagsList"></div>
                    </div>
                </div>
            </div>
            <div class="results-count" id="resultsCount"></div>
        </div>

        <div class="portfolio-grid" id="portfolioGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">
            <h3>No portfolios found</h3>
            <p>Try adjusting your filters</p>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

</body>
</html>
