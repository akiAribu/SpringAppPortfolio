<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <link rel="stylesheet" href="/css/portfolio_view.css">
</head>

<body>

<header class="topbar">

    <div class="topbar-left">

        <a href="/"
           class="back-button">
            ← Home
        </a>

    </div>

    <div class="topbar-right">

        <a href="/profile"
           class="primary-btn">
            My Profile
        </a>

    </div>

</header>

<main class="layout">

    <aside class="sidebar"
           th:if="${portfolio != null}">

        <div class="profile-card">

            <div class="avatar-wrapper">

                <img id="avatar"
                     th:src="@{'/api/v1/users/' + ${portfolio.userId} + '/avatar'}"
                     alt="Avatar"
                     onerror="this.src='/api/v1/users/me/avatar'">

            </div>

            <div class="profile-info">

                <h2>

                    <span th:text="${portfolio.firstName != null ? portfolio.firstName : ''}"></span>

                    <span th:text="${portfolio.lastName != null ? portfolio.lastName : ''}"></span>

                </h2>

                <p class="username"
                   th:text="'@' + ${portfolio.username}">
                </p>

                <p class="specialization"
                   th:if="${portfolio.specialization != null}"
                   th:text="${portfolio.specialization.getDisplayName()}">
                </p>

                <div class="stats">

                    <div class="stat-box">

                        <span class="stat-value"
                              th:text="${portfolio.viewsCount}">
                        </span>

                        <span class="stat-label">
                            Views
                        </span>

                    </div>

                    <div class="stat-box"
                         th:if="${portfolio.experienceYears != null}">

                        <span class="stat-value"
                              th:text="${portfolio.experienceYears}">
                        </span>

                        <span class="stat-label">
                            Years
                        </span>

                    </div>

                </div>

                <div class="bio"
                     th:if="${portfolio.bio != null && !portfolio.bio.isEmpty()}">

                    <p th:text="${portfolio.bio}"></p>

                </div>

            </div>

        </div>

        <section class="contacts-card">

            <h3>Contacts</h3>

            <div id="contactsContainer">

                <div class="contact-item"
                     th:each="contact : ${portfolio.contacts}">

                    <div class="contact-type"
                         th:text="${contact.contactType}">
                    </div>

                    <div class="contact-value"
                         th:text="${contact.contactValue}">
                    </div>

                </div>

                <p class="empty-text"
                   th:if="${#lists.isEmpty(portfolio.contacts)}">

                    No contacts

                </p>

            </div>

        </section>

    </aside>

    <section class="content-area">

        <div class="content-header">

            <div>

                <h1 class="page-title">
                    Portfolio Projects
                </h1>

                <p class="page-subtitle">
                    Explore all published works
                </p>

            </div>

        </div>

        <div class="projects-grid"
             th:if="${not #lists.isEmpty(portfolio.projects)}">

            <div class="project-card"
                 th:each="project : ${portfolio.projects}">

                <a th:href="'/project/' + ${project.projectId} + '?portfolioId=' + ${portfolio.portfolioId}"
                   class="project-link">

                    <div th:if="${project.preview}">

                        <img class="project-image"
                             th:src="'/api/v1/projects/' + ${project.projectId} + '/preview?portfolioId=' + ${portfolio.portfolioId}"
                             alt="Project Preview">

                    </div>

                    <div th:unless="${project.preview}"
                         class="project-image project-placeholder">

                        No Preview

                    </div>

                    <div class="project-body">

                        <h3 class="project-title"
                            th:text="${project.title}">
                        </h3>

                        <p class="project-description"
                           th:text="${project.shortDescription}">
                        </p>

                    </div>

                </a>

            </div>

        </div>

        <div class="empty-state"
             th:if="${#lists.isEmpty(portfolio.projects)}">

            No projects yet

        </div>

        <div class="error-box"
             th:if="${error}">

            <p th:text="${error}"></p>

        </div>

    </section>

</main>

</body>
</html>
