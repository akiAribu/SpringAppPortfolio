<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portfolio</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<h2>Portfolio</h2>
<a href="/profile">My Profile</a>
<br><br>

<div th:if="${portfolio != null}">
    <h3>User</h3>
    <p><b>Username:</b> <span th:text="${portfolio.username}"></span></p>

    <h3>Avatar</h3>
    <img id="avatar" th:src="'/api/v1/users/' + ${portfolio.userId} + '/avatar'"
         style="width:150px;height:150px;border-radius:50%"
         onerror="this.src='/api/v1/users/me/avatar'"/>

    <h3>Contacts</h3>
    <div id="contactsContainer">
        <div th:each="contact : ${portfolio.contacts}">
            <p>
                <b th:text="${contact.contactType}"></b>:
                <span th:text="${contact.contactValue}"></span>
            </p>
        </div>
        <p th:if="${#lists.isEmpty(portfolio.contacts)}">No contacts</p>
    </div>

    <p><b>Public:</b> <span th:text="${portfolio.isPublic ? 'Yes' : 'No'}"></span></p>
    <p><b>Views:</b> <span th:text="${portfolio.viewsCount}"></span></p>

    <hr>
    <h3>Projects</h3>
    <div th:if="${not #lists.isEmpty(portfolio.projects)}" style="display: flex; flex-wrap: wrap; gap: 15px;">
        <div th:each="project : ${portfolio.projects}"
             style="border: 1px solid #ccc; padding: 15px; width: 250px; border-radius: 8px;">
            <a th:href="'/project/' + ${project.projectId} + '?portfolioId=' + ${portfolio.portfolioId}" style="text-decoration: none; color: inherit;">
                <div th:if="${project.preview}" style="text-align: center; margin-bottom: 10px;">
                    <img th:src="'/api/v1/projects/' + ${project.projectId} + '/preview?portfolioId=' + ${portfolio.portfolioId}"
                         style="max-width: 100%; max-height: 150px; border-radius: 4px;"/>
                </div>
                <h4 th:text="${project.title}" style="margin: 5px 0;"></h4>
                <p th:text="${project.shortDescription}" style="font-size: 14px; color: #666;"></p>
            </a>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(portfolio.projects)}">No projects</p>
</div>

<div th:if="${error}">
    <p style="color:red;" th:text="${error}"></p>
</div>

</body>
</html>
