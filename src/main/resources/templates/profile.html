<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Profile</title>

    <link rel="stylesheet" href="/css/profile.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<header class="topbar">
    <div class="topbar-left">
        <a href="/" class="back-button">
            ← Home
        </a>
    </div>

    <div class="topbar-right" th:if="${isOwner}">
        <button class="primary-btn" onclick="showCreateProjectForm()">
            + New Project
        </button>
    </div>
</header>

<main class="layout">

    <aside class="sidebar">

        <div class="profile-card">

            <div class="avatar-wrapper">
                <img id="avatar"
                     src="/api/v1/users/me/avatar"
                     alt="Avatar">
            </div>

            <div class="profile-info">

                <h2>
                    <span th:text="${portfolio.firstName}"></span>
                    <span th:text="${portfolio.lastName}"></span>
                </h2>

                <p class="username"
                   th:text="'@' + ${portfolio.username}">
                </p>

                <p class="specialization"
                   th:if="${portfolio.specialization != null}"
                   th:text="${portfolio.specialization.getDisplayName()}">
                </p>

                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-value"
                              th:text="${portfolio.experienceYears}"></span>
                        <span class="stat-label">Years</span>
                    </div>
                </div>

                <div class="bio"
                     th:if="${portfolio.bio != null && !portfolio.bio.isEmpty()}">
                    <p th:text="${portfolio.bio}"></p>
                </div>

            </div>

            <div class="sidebar-actions" th:if="${isOwner}">

                <label class="upload-btn">
                    Upload Avatar
                    <input type="file" id="avatarInput" hidden>
                </label>

                <button class="secondary-btn"
                        onclick="uploadAvatar()">
                    Save Avatar
                </button>

                <button class="secondary-btn"
                        onclick="togglePortfolioVisibility()">
                    Toggle Visibility
                </button>

                <a href="/profile/edit" class="secondary-btn link-btn">
                    Edit Profile
                </a>

                <a href="/logout" class="danger-btn">
                    Logout
                </a>

            </div>

        </div>

        <section class="contacts-card">
            <h3>Contacts</h3>

            <div id="contactsContainer"></div>

            <p id="contactsEmpty" style="display:none;">
                No contacts
            </p>

            <a href="/profile/edit" class="manage-link">
                Manage Contacts
            </a>
        </section>

    </aside>

    <section class="content-area">

        <div id="createProjectForm" class="project-form">

            <h3>Create Project</h3>

            <input type="text"
                   id="projectTitle"
                   placeholder="Project title">

            <textarea id="projectShortDesc"
                      placeholder="Short description"></textarea>

            <textarea id="projectFullDesc"
                      placeholder="Full description"></textarea>

            <input type="text"
                   id="projectLink"
                   placeholder="Project link">

            <input type="file"
                   id="projectPreview"
                   accept="image/*">

            <label class="checkbox-row">
                <input type="checkbox"
                       id="projectIsVisible"
                       checked>
                Visible
            </label>

            <div class="form-actions">
                <button class="primary-btn"
                        onclick="createProject()">
                    Create
                </button>

                <button class="secondary-btn"
                        onclick="hideCreateProjectForm()">
                    Cancel
                </button>
            </div>

            <p id="createProjectResult"></p>

        </div>

        <div id="projectsContainer" class="projects-grid"></div>

        <p id="noProjects" class="empty-state">
            No projects yet
        </p>

    </section>

</main>

<script th:inline="javascript">

    window.portfolioData = {
        isPublic: [[${portfolio.isPublic}]]
    };

</script>

<script src="/js/profile.js"></script>

</body>
</html>
