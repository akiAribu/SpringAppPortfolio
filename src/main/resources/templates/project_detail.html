<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.title}">Project</title>

    <link rel="stylesheet" href="/css/project_detail.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<header class="topbar">
    <a class="back-button"
       th:href="${isOwner} ? '/profile' : '/u/' + ${userId}">
        ← Back
    </a>

    <h1 class="top-title" th:text="${project.title}"></h1>
</header>

<main class="project-layout">

    <section class="project-main">

        <div class="hero-card" th:if="${project.preview}">
            <img th:src="'/api/v1/projects/' + ${project.projectId} + '/preview?portfolioId=' + ${portfolioId}"
                 alt="preview">
        </div>

        <div class="card" th:if="${isOwner}">
            <h3>Preview</h3>

            <input type="file" id="previewFile" accept="image/*">

            <button class="btn-primary" onclick="uploadPreview()">
                Upload Preview
            </button>

            <p id="previewResult"></p>
        </div>

        <div class="card">
            <h3>Technologies</h3>

            <div id="projectTags"></div>

            <div th:if="${isOwner}">
                <h4>Add tags</h4>

                <div class="tag-dropdown">
                    <button type="button"
                            class="tag-dropdown-button"
                            onclick="toggleTagsDropdown()">
                        <span>Select technologies</span>
                        <span>▼</span>
                    </button>

                    <div id="tagsDropdownMenu" class="tag-dropdown-menu">
                        <div id="tagsCheckboxes" class="tags-grid"></div>
                    </div>
                </div>

                <button class="btn-primary" onclick="saveTags()">
                    Save
                </button>

                <p id="tagsResult"></p>
            </div>
        </div>

        <div class="card">
            <h3>Description</h3>
            <p class="text-block" th:text="${project.fullDescription}"></p>
        </div>

        <div class="card">
            <h3>Gallery</h3>

            <div class="gallery">

                <div class="gallery-item"
                     th:each="image : ${project.images}"
                     th:attr="data-image-url='/api/v1/projects/' + ${project.projectId} + '/image/' + ${image.imageId} + '?portfolioId=' + ${portfolioId},
                              data-image-caption=${image.imageCaption},
                              data-image-id=${image.imageId}"
                     onclick="openImageModal(this)">

                    <img th:src="'/api/v1/projects/' + ${project.projectId} + '/image/' + ${image.imageId} + '?portfolioId=' + ${portfolioId}">
                </div>

            </div>

            <p th:if="${#lists.isEmpty(project.images)}" class="muted">
                No images in gallery
            </p>

            <div th:if="${isOwner}" class="upload-box">
                <input type="file" id="imageFile">
                <input type="text" id="imageCaption" placeholder="Caption">

                <button class="btn-primary" onclick="addImage()">
                    Add Image
                </button>

                <p id="imageResult"></p>
            </div>

        </div>

        <div class="card" th:if="${project.projectLink}">
            <a class="btn-link"
               th:href="${project.projectLink}"
               target="_blank">
                Open Project
            </a>
        </div>

    </section>

    <aside class="project-sidebar" th:if="${isOwner}">

        <div class="card sticky">

            <h3>Owner Controls</h3>

            <button class="btn-secondary" onclick="showEditForm()">
                Edit
            </button>

            <button class="btn-danger" onclick="deleteProject()">
                Delete
            </button>

        </div>

    </aside>

</main>

<div id="editModalOverlay" class="edit-modal-overlay">

    <div class="edit-modal">

        <h1>Edit project</h1>

        <input id="editTitle" th:value="${project.title}">

        <textarea id="editShortDescription"
                  th:text="${project.shortDescription}"></textarea>

        <textarea id="editFullDescription"
                  th:text="${project.fullDescription}"></textarea>

        <input id="editLink"
               th:value="${project.projectLink}">

        <div class="modal-actions">
            <button class="btn-primary" onclick="updateProject()">Save</button>
            <button class="btn-secondary" onclick="hideEditForm()">Cancel</button>
        </div>

        <p id="editResult"></p>

    </div>

</div>

<div id="imageModalOverlay" class="modal-overlay">

    <div class="image-modal">

        <div class="image-modal-content">

            <img id="modalImage" src="" alt="">

            <div class="image-modal-footer">

                <div id="modalImageCaption" class="image-caption"></div>

                <button id="modalDeleteButton"
                        class="btn-danger"
                        style="display:none;">
                    Delete
                </button>

            </div>

        </div>

    </div>

</div>

<script th:inline="javascript">
    window.projectId = [[${project.projectId}]];
    window.portfolioId = [[${portfolioId}]];
    window.isOwner = [[${isOwner}]];
    window.projectTagNames = [[${projectTagNames}]];
</script>

<script src="/js/project_detail.js"></script>

</body>
</html>
